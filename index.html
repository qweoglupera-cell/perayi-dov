<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PERAYI DÖV</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  overflow:hidden; font-family:Arial,sans-serif;
  background:radial-gradient(circle at center,#35102b 0,#130914 45%,#070308 100%);
  color:white; user-select:none; -webkit-tap-highlight-color:transparent;
}
.wrap{text-align:center;width:min(92vw,430px)}
h1{margin:0 0 8px;font-size:30px}
.sub{opacity:.7;margin-bottom:18px}
.photoBox{
  position:relative; width:min(88vw,390px); aspect-ratio:1/1;
  margin:auto; border-radius:24px; overflow:hidden; cursor:pointer;
  box-shadow:0 0 35px rgba(255,70,150,.25);
  border:3px solid rgba(255,255,255,.12);
  transform-origin:center;
}
.photoBox.hit{animation:shake .18s linear}
.photo{
  width:100%;height:100%;object-fit:cover;display:block;
  pointer-events:none;
}
.hitmark{
  position:absolute; pointer-events:none; transform:translate(-50%,-50%) scale(.4);
  font-size:70px; filter:drop-shadow(0 5px 8px #000);
  animation:pop .42s ease-out forwards;
}
.ripple{
  position:absolute; pointer-events:none; width:30px;height:30px;border:4px solid white;
  border-radius:50%; transform:translate(-50%,-50%);
  animation:ripple .4s ease-out forwards;
}
.counter{font-size:22px;font-weight:bold;margin-top:17px}
.message{height:30px;margin-top:8px;color:#ffb5db;font-weight:bold}
button{
  margin-top:10px;padding:10px 18px;border:0;border-radius:999px;
  background:#fff;color:#190915;font-weight:bold;cursor:pointer;
}
@keyframes shake{
  0%{transform:translateX(0) rotate(0)}
  25%{transform:translateX(-10px) rotate(-2deg)}
  50%{transform:translateX(11px) rotate(2deg)}
  75%{transform:translateX(-7px) rotate(-1deg)}
  100%{transform:translateX(0) rotate(0)}
}
@keyframes pop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-20deg)}
  35%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(8deg)}
  100%{opacity:0;transform:translate(-50%,-70%) scale(1.4) rotate(15deg)}
}
@keyframes ripple{
  from{opacity:.9;width:15px;height:15px}
  to{opacity:0;width:130px;height:130px}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>PERAYI DÖVE DÖVE SİK </h1>
  <div class="sub">Yüzüme tıklayabilirsin, hak ettim.</div>

  <div class="photoBox" id="photoBox">
    <img class="photo" id="photo" alt="Ben">
  </div>

  <div class="counter">Vuruş: <span id="count">0</span></div>
  <div class="message" id="message"></div>
  <button id="reset">Sıfırla</button>
</div>

<script>
const img = document.getElementById("photo");
// Hızlı Resim doğrudan görsel bağlantısı:
img.src = "ben.jpg";

const box = document.getElementById("photoBox");
const countEl = document.getElementById("count");
const message = document.getElementById("message");
const reset = document.getElementById("reset");
let count = 0;

const messages = {
  1:"Daha ilk vuruş ",
  5:"Tamam tamam sakin ",
  10:"Yüzümün ayarı kaçtı galiba",
  20:"Ben galiba özrümü biraz daha büyütmeliyim",
  30:"TAMAM CEYLİN SAKİN ",
  50:"Artık sarılabilir miyiz..."
};

function hit(x,y){
  count++;
  countEl.textContent = count;

  box.classList.remove("hit");
  void box.offsetWidth;
  box.classList.add("hit");

  const mark=document.createElement("div");
  mark.className="hitmark";
  mark.textContent=Math.random()>.45 ? "👊" : "💥";
  mark.style.left=x+"px";
  mark.style.top=y+"px";
  box.appendChild(mark);

  const ripple=document.createElement("div");
  ripple.className="ripple";
  ripple.style.left=x+"px";
  ripple.style.top=y+"px";
  box.appendChild(ripple);

  setTimeout(()=>{mark.remove();ripple.remove()},450);

  message.textContent=messages[count] || (count%10===0 ? "Acımadı... biraz daha " : "");

  if(navigator.vibrate) navigator.vibrate(35);
}

box.addEventListener("pointerdown",(e)=>{
  const r=box.getBoundingClientRect();
  hit(e.clientX-r.left,e.clientY-r.top);
});

reset.addEventListener("click",()=>{
  count=0;
  countEl.textContent="0";
  message.textContent="";
});
</script>
</body>
</html>
